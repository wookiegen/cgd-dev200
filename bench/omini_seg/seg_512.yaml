# OminiControl segmentation adapter, ADE20K train (bench/omini_seg/train_seg.py). Copied from OminiControl train/config/spatial_alignment.yaml
# (the official spatial recipe: LoRA r 4, Prodigy lr 1, batch 1, gradient checkpointing, drop text / image 0.1); condition_type seg,
# accumulate 2 x 10000 optimizer steps = 20000 samples (~1 epoch of the 20k ADE20K crops); checkpoints every 1000 optimizer steps.
flux_path: "black-forest-labs/FLUX.1-dev"
dtype: "bfloat16"

model:
  independent_condition: false

train:
  accumulate_grad_batches: 2
  dataloader_workers: 5
  save_interval: 2000        # counted in batches by the callback = 1000 optimizer steps
  sample_interval: 2000
  max_steps: 10000           # optimizer steps (Lightning)
  gradient_checkpointing: true
  save_path: "/data/wookiekim/cgd/data/omini_seg/runs"
  print_every_n_steps: 50

  condition_type: "seg"
  dataset:
    type: "ade20k_seg"
    set: "ade20k_train"
    condition_size:
      - 512
      - 512
    target_size:
      - 512
      - 512
    drop_text_prob: 0.1
    drop_image_prob: 0.1

  lora_config:
    r: 4
    lora_alpha: 4
    init_lora_weights: "gaussian"
    target_modules: "(.*x_embedder|.*(?<!single_)transformer_blocks\\.[0-9]+\\.norm1\\.linear|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_k|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_q|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_v|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_out\\.0|.*(?<!single_)transformer_blocks\\.[0-9]+\\.ff\\.net\\.2|.*single_transformer_blocks\\.[0-9]+\\.norm\\.linear|.*single_transformer_blocks\\.[0-9]+\\.proj_mlp|.*single_transformer_blocks\\.[0-9]+\\.proj_out|.*single_transformer_blocks\\.[0-9]+\\.attn.to_k|.*single_transformer_blocks\\.[0-9]+\\.attn.to_q|.*single_transformer_blocks\\.[0-9]+\\.attn.to_v|.*single_transformer_blocks\\.[0-9]+\\.attn.to_out)"

  optimizer:
    type: "Prodigy"
    params:
      lr: 1
      use_bias_correction: true
      safeguard_warmup: true
      weight_decay: 0.01
